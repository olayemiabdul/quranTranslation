# Universal Quran — Codemagic
#
# Two workflows, because Android and iOS want different machines and
# different signing. The Android one runs on Linux, which is faster and
# cheaper than a Mac.
#
# ---------------------------------------------------------------------------
# Changes in this revision, after the first real iOS run
# ---------------------------------------------------------------------------
#
#  * BUILD NUMBER. The offset was `PROJECT_BUILD_NUMBER + 10`, which yields
#    exactly 10 on a fresh counter — and 10 is already taken on BOTH stores
#    (Play versionCode 10, App Store Connect CFBundleVersion 10). The upload
#    was rejected with ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE. The offset is
#    now 100, and iOS asks App Store Connect for the real number when it can.
#
#  * APPLICATION ID. `PACKAGE_NAME` said `tunedtech.uk.quranCompleteUi`. The
#    live app on Play is `com.tunedtech.quran_complete_ui`. The Android
#    workflow now FAILS EARLY if build.gradle drifts from the Play id again,
#    rather than after a rejected upload.
#
#  * TESTFLIGHT. The App Store Connect publishing block is enabled, since the
#    last run was already trying to upload.
#
# Earlier fixes, kept:
#
#  * `flutter build ios --release --no-codesign` produces a `.app`, never an
#    `.ipa`, so the old artifact path could never match. An IPA needs real
#    signing: `flutter build ipa` with an export options plist.
#  * `flutter pub upgrade` ran on every build, so no two builds used the same
#    dependency set. `pub get` only; commit pubspec.lock.
#  * The Android keystore env vars were never written to `key.properties`,
#    which is what android/app/build.gradle actually reads.
#  * `flutter build apk` — Play needs an `.aab`.
#  * No `triggering`, so nothing ran on push. No caching, so every build
#    re-downloaded the world.

definitions:
  cache_flutter: &cache_flutter
    cache_paths:
      - $HOME/.pub-cache
      - $HOME/.gradle/caches
      - $FLUTTER_ROOT/.pub-cache

  email_me: &email_me
    email:
      recipients:
        - olayemi.abdullahi9585@gmail.com
      notify:
        success: true
        failure: true

workflows:
  # ---------------------------------------------------------------- Android
  android-release:
    name: Android — release bundle
    max_build_duration: 90
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17
      android_signing:
        # Upload the SAME keystore the live app was signed with, under
        # Teams > Code signing identities > Android keystores, named exactly
        # this. A different key means Play rejects the update permanently.
        - quran_upload_keystore
      vars:
        # The package name on Play. This is permanent — a different value is
        # a different app, with none of the existing installs or reviews.
        PACKAGE_NAME: "com.tunedtech.quran_complete_ui"
        BUILD_NAME: "2.0.0"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: master
          include: true
          source: true

    cache:
      <<: *cache_flutter

    scripts:
      - name: Check the application id and target SDK
        script: |
          # Both of these have already cost an upload. Fail in thirty seconds
          # rather than after a build and a manual upload.
          grep -q "applicationId \"$PACKAGE_NAME\"" android/app/build.gradle || {
            echo "applicationId does not match $PACKAGE_NAME — Play will reject this."
            grep -n "applicationId" android/app/build.gradle
            exit 1
          }
          grep -qE "targetSdk(Version)? 3[5-9]" android/app/build.gradle || {
            echo "targetSdk is below 35 — Play will reject this."
            exit 1
          }

      - name: Build number
        script: |
          # Play is on versionCode 10. PROJECT_BUILD_NUMBER increments on
          # every Codemagic build, so +100 clears it with room to spare.
          echo "BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 100))" >> $CM_ENV

      - name: Write key.properties
        script: |
          # android/app/build.gradle reads this file. The android_signing
          # block above gives us the CM_KEYSTORE_* values.
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Dependencies
        # pub get only. Never pub upgrade in CI.
        script: flutter pub get

      - name: Analyze
        script: flutter analyze --no-fatal-infos

      - name: Test
        script: |
          # Passes cleanly when there are no tests yet, instead of failing the
          # build. Drop the guard once there are real tests.
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test
          else
            echo "No tests found — skipping."
          fi

      - name: Build app bundle
        script: |
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/bundle/**/*.aab
      # Keep the mapping file: Play needs it to deobfuscate crash reports.
      - build/**/outputs/mapping/**/mapping.txt

    publishing:
      <<: *email_me
      # Uncomment once a Google Play service account JSON is saved in
      # Codemagic. Until then, download the AAB from the email and upload it
      # by hand to internal testing.
      #
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  # -------------------------------------------------------------------- iOS
  ios-release:
    name: iOS — App Store build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Teams > Integrations > Apple Developer Portal, using an App Store
      # Connect API key, named exactly this.
      app_store_connect: quran_app_store_connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        # Matches ios/Runner.xcodeproj. NOT the `ios:` block in pubspec.yaml,
        # which Flutter ignores entirely. iOS and Android ids need not match.
        bundle_identifier: tunedtech.uk.quranCompleteUi
      vars:
        BUILD_NAME: "2.0.0"
        # App Store Connect > your app > App Information > Apple ID. A number
        # like 1234567890. Set it and the build number tracks the store
        # exactly; leave it empty and the offset below is used instead.
        APP_STORE_APP_ID: ""

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Build number
        script: |
          # CFBundleVersion 10 is already uploaded, so never produce 10 again.
          NEXT=$((PROJECT_BUILD_NUMBER + 100))

          # Ask App Store Connect for the real latest when we can. Written so
          # a missing id or a failed call falls back instead of breaking the
          # build.
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
            case "$LATEST" in
              ''|*[!0-9]*) echo "Could not read the latest build number — using the offset." ;;
              *) NEXT=$((LATEST + 1)) ;;
            esac
          fi

          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
          echo "Next iOS build number: $NEXT"

      - name: Dependencies
        script: |
          flutter pub get
          # Generated.xcconfig has to exist before pod install, or CocoaPods
          # cannot resolve the Flutter pods.
          flutter precache --ios
          find . -name "Podfile" -execdir pod install \;

      - name: Code signing
        # Fetches the provisioning profiles and writes
        # /Users/builder/export_options.plist for the build below.
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive

    publishing:
      <<: *email_me
      app_store_connect:
        auth: integration
        # Goes to TestFlight, not to review. Promote to the App Store by hand
        # once it has actually been used on a device.
        submit_to_testflight: true
        submit_to_app_store: false
        # Uncomment and name a group once one exists in App Store Connect.
        # beta_groups:
        #   - Internal testers